<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aventuras das Vogais</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: "Quicksand", sans-serif; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }

  @keyframes bounce-sm {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .animate-bounce-sm { animation: bounce-sm 2s ease-in-out infinite; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .animate-pop { animation: pop 0.35s ease-out forwards; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(4px); }
  }
  .animate-shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both; }

  @keyframes glow-correct {
    0%, 100% { box-shadow: 0 0 0 0 rgba(40,134,0,0.4), 0 8px 0 0 #298600; }
    50%       { box-shadow: 0 0 22px 8px rgba(40,134,0,0.7), 0 8px 0 0 #298600; }
  }
  .animate-glow-correct { animation: glow-correct 0.6s ease-in-out infinite; }

  @keyframes bounce-once {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.06); }
    65%  { transform: scale(0.97); }
    100% { transform: scale(1); }
  }
  .animate-bounce-once { animation: bounce-once 0.5s ease-out forwards; }

  /* ── Botões de letra ─────────────────────────────── */
  .btn-letter {
    width: 112px; height: 112px;
    border-radius: 9999px;
    border: 4px solid #0058bd;
    background: #ffffff;
    color: #0058bd;
    font-family: "Quicksand", sans-serif;
    font-size: 56px; font-weight: 700;
    box-shadow: 0 8px 0 0 #0058bd;
    cursor: pointer;
    transition: box-shadow 0.08s ease, transform 0.08s ease;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .btn-letter:hover  { transform: scale(1.05); }
  .btn-letter:active { box-shadow: 0 0px 0 0 #0058bd; transform: translateY(8px); }
  .btn-letter.correct {
    background: #84fe58; border-color: #298600; color: #052100;
    box-shadow: 0 8px 0 0 #298600;
  }
  .btn-letter.wrong {
    background: #ffdad6; border-color: #ba1a1a; color: #93000a;
    box-shadow: 0 8px 0 0 #ba1a1a;
  }

  /* ── Glassmorphism ───────────────────────────────── */
  .glass {
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255,255,255,0.65);
  }

  /* ── Tela final ──────────────────────────────────── */
  #end-screen {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,17,89,0.55);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
  }
  #end-screen.hidden { display: none; }

  /* ── Balão de fala ───────────────────────────────── */
  #speech-bubble {
    position: absolute;
    /* à direita e levemente acima do centro do círculo */
    top: 0px; left: 188px;
    z-index: 50;
    background: #ffffff;
    border: 3px solid #0058bd;
    border-radius: 16px;
    padding: 10px 14px;
    box-shadow: 0 4px 0 0 #0058bd;
    font-size: 13px; font-weight: 700; color: #0058bd;
    width: 148px; text-align: center; line-height: 1.4;
    font-family: "Quicksand", sans-serif;
    white-space: normal;
    pointer-events: none;
  }
  /* triângulo apontando para a esquerda (← para o personagem) */
  #speech-bubble::before {
    content: "";
    position: absolute;
    top: 20px; left: -12px;
    width: 0; height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-right: 12px solid #0058bd;
  }
  #speech-bubble::after {
    content: "";
    position: absolute;
    top: 22px; left: -8px;
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 10px solid #ffffff;
  }

  /* ── Tela de menu / tiles de atividade ───────────────── */
  #menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 540px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: transparent; border: none; padding: 0;
    font-family: "Quicksand", sans-serif;
  }
  .tile-face {
    width: 100%; aspect-ratio: 1; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 4px solid #0058bd; box-shadow: 0 8px 0 0 #0058bd;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .tile-active { cursor: pointer; }
  .tile-active:hover  .tile-face { transform: scale(1.04); }
  .tile-active:active .tile-face { box-shadow: 0 0 0 0 #0058bd; transform: translateY(8px); }
  .tile-label { font-size: 22px; font-weight: 700; color: #001159; text-transform: lowercase; }
  .tile-locked { cursor: default; }
  .tile-locked .tile-face {
    background: rgba(255,255,255,0.45); border: 4px dashed #9aa3c7;
    box-shadow: 0 8px 0 0 rgba(154,163,199,0.45);
  }
  .vowels {
    display: flex; gap: 2px; font-weight: 700; font-family: "Quicksand", sans-serif;
    font-size: clamp(22px, 7vw, 42px); line-height: 1;
  }
  /* Toggle de modo (7 botões) no lado esquerdo do menu */
  #mode-toggle {
    position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 5px; z-index: 60;
  }
  .mode-btn {
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: 0.04em; padding: 8px 8px; min-width: 84px; border-radius: 12px;
    border: 3px solid #0058bd; background: #fff; color: #0058bd; cursor: pointer;
    box-shadow: 0 4px 0 0 #0058bd; transition: transform .1s, background .15s, color .15s;
  }
  .mode-btn:hover  { transform: scale(1.03); }
  .mode-btn:active { box-shadow: 0 0 0 0 #0058bd; transform: translateY(4px); }
  .mode-btn.active { background: #0058bd; color: #fff; }
  @media (max-width: 640px) { #mode-toggle { left: 4px; } .mode-btn { min-width: 64px; padding: 6px 4px; font-size: 9px; } }
  /* Chips de letras embaralhadas */
  #scramble-chips { display: none; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 6px; }

  /* ── Grade de debug (temporária) ────────────────────────────────────────── */
  #debug-grid {
    position: fixed; inset: 0; z-index: 900;
    display: none; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(8, 1fr);
    pointer-events: none;
  }
  #debug-grid.visible { display: grid; }
  .debug-cell {
    border: 1px solid rgba(255,255,255,0.45);
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 3px 5px;
    font-family: monospace; font-size: 11px; font-weight: 700;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 6px #000;
    background: rgba(0,0,0,0.04);
  }
  #debug-grid-btn {
    position: fixed; bottom: 16px; right: 16px; z-index: 950;
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 11px;
    padding: 6px 10px; border-radius: 10px; border: 2px solid #555;
    background: rgba(0,0,0,0.55); color: #fff; cursor: pointer;
    pointer-events: all;
  }
  .scramble-chip {
    width: 34px; height: 46px; border-radius: 8px; border: 3px solid #f59e0b; background: #fff9e6;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #b26b00;
    font-family: "Quicksand", sans-serif; text-transform: lowercase;
  }
  /* Caixas de soletração (modo palavra) */
  #spell-boxes { display: none; flex-wrap: nowrap; gap: 6px; justify-content: center; margin-top: 6px; }
  .spell-box {
    width: 34px; height: 46px; border-radius: 8px; border: 3px solid #dee1ff; background: #f3f4ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #001159;
    font-family: "Quicksand", sans-serif; text-transform: lowercase;
  }
  .spell-box.given  { border-style: dashed; color: #9aa3c7; background: #eef0ff; }
  .spell-box.ok     { border-color: #298600; background: #e7f6e1; color: #298600; }
  .spell-box.bad    { border-color: #e8423a; background: #ffe9e7; color: #e8423a; }
  .spell-box.reveal { border-color: #f59e0b; background: #fff6e6; color: #b26b00; }
  #spell-skip {
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 16px;
    padding: 10px 20px; border-radius: 9999px; border: 3px solid #0058bd;
    background: #fff; color: #0058bd; cursor: pointer; box-shadow: 0 4px 0 0 #0058bd;
  }
  #spell-skip:active { box-shadow: 0 0 0 0 #0058bd; transform: translateY(4px); }
  /* Caixa alta / baixa das letras e palavras dentro da atividade (padrão: alta) */
  #game-screen.case-upper .btn-letter,
  #game-screen.case-upper #word-text,
  #game-screen.case-upper .spell-box { text-transform: uppercase; }
  #game-screen.case-lower .btn-letter,
  #game-screen.case-lower #word-text,
  #game-screen.case-lower .spell-box { text-transform: lowercase; }

  /* ── Personagem do menu (tema) ───────────────────────────────── */
  #menu-character {
    position: fixed; bottom: 24px; right: 24px; z-index: 50;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
  }
  #menu-speech-bubble {
    background: #fff; border: 3px solid #0058bd; border-radius: 16px;
    padding: 10px 14px; box-shadow: 0 4px 0 0 #0058bd;
    font-size: 14px; font-weight: 700; color: #0058bd;
    max-width: 160px; text-align: center; line-height: 1.4;
    font-family: "Quicksand", sans-serif; position: relative;
  }
  #menu-speech-bubble::before {
    content: ""; position: absolute; bottom: -12px; left: 50%;
    transform: translateX(-50%); width: 0; height: 0;
    border-left: 10px solid transparent; border-right: 10px solid transparent;
    border-top: 12px solid #0058bd;
  }
  #menu-speech-bubble::after {
    content: ""; position: absolute; bottom: -8px; left: 50%;
    transform: translateX(-50%); width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 9px solid #fff;
  }
  #menu-char-img { width: 360px; height: auto; display: block; }
</style>
</head>

<body style="
  min-height:100vh;
  background-color:#dee1ff;
  background-size: cover; background-position: center; background-attachment: fixed;
  overflow-x: hidden;
">

<!-- ── Tela de menu (seleção de atividade) ───────────────────────────────────── -->
<div id="menu-screen">
  <!-- Modo de jogo: escolher letra inicial (LETRAS) ou soletrar (PALAVRAS) -->
  <div id="mode-toggle">
    <button id="mode-letras"      class="mode-btn active" onclick="setGameMode('letras')">LETRAS</button>
    <button id="mode-vogais"      class="mode-btn"        onclick="setGameMode('vogais')">VOGAIS</button>
    <button id="mode-consoantes"  class="mode-btn"        onclick="setGameMode('consoantes')">CONSOANTES</button>
    <button id="mode-embaralhado" class="mode-btn"        onclick="setGameMode('embaralhado')">EMBARALHADO</button>
    <button id="mode-palavras"    class="mode-btn"        onclick="setGameMode('palavras')">PALAVRAS</button>
    <button id="mode-lacuna"      class="mode-btn"        onclick="setGameMode('lacuna')">LACUNA</button>
    <button id="mode-complete"    class="mode-btn"        onclick="setGameMode('complete')">COMPLETE</button>
  </div>
  <header class="w-full px-4 pt-4 pb-2">
    <div class="glass rounded-full px-6 py-3 flex justify-between items-center max-w-5xl mx-auto shadow-sm">
      <h1 style="font-size:22px;font-weight:700;color:#0058bd;">Escolha uma atividade</h1>
      <button
        class="bg-toggle-btn" onclick="toggleBackground()" title="Mostrar imagem de fundo"
        style="
          background:#0058bd; color:#fff; border:none; border-radius:9999px;
          width:38px; height:38px; display:flex; align-items:center; justify-content:center;
          cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.2); transition:transform 0.1s;
        "
        onmouseenter="this.style.transform='scale(1.1)'"
        onmouseleave="this.style.transform='scale(1)'"
      >
        <span class="material-symbols-outlined" style="font-size:20px;">hide_image</span>
      </button>
    </div>
  </header>

  <main class="flex items-center justify-center px-4 py-6 min-h-[calc(100vh-80px)]">
    <div id="menu-grid"></div>
  </main>

  <!-- ── Personagem do tema ──────────────────────────────────────────────────── -->
  <div id="menu-character">
    <div id="menu-speech-bubble"></div>
    <img id="menu-char-img" src="" alt="Personagem do tema" />
  </div>
</div>

<!-- ── Jogo (tela) ───────────────────────────────────────────────────────────── -->
<div id="game-screen" class="case-upper" style="display:none;">

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="w-full px-4 pt-4 pb-2">
  <div class="glass rounded-full px-6 py-3 flex justify-between items-center max-w-5xl mx-auto shadow-sm">
    <h1 id="game-title" style="font-size:22px;font-weight:700;color:#0058bd;">Aventuras das Vogais</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <button
        onclick="showMenu()" title="Voltar ao menu"
        style="
          background:#0058bd; color:#fff; border:none; border-radius:9999px;
          width:38px; height:38px; display:flex; align-items:center; justify-content:center;
          cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.2); transition:transform 0.1s;
        "
        onmouseenter="this.style.transform='scale(1.1)'"
        onmouseleave="this.style.transform='scale(1)'"
      >
        <span class="material-symbols-outlined" style="font-size:20px;">home</span>
      </button>
      <span id="progress-text" style="font-size:16px;font-weight:700;color:#0058bd;font-family:'Lexend',sans-serif;">1 / 20</span>
      <button
        id="case-toggle" onclick="toggleLetterCase()" title="Alternar maiúsculas / minúsculas"
        style="
          background:#0058bd; color:#fff; border:none; border-radius:9999px;
          width:38px; height:38px; display:flex; align-items:center; justify-content:center;
          cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.2); transition:transform 0.1s;
          font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.02em;
        "
        onmouseenter="this.style.transform='scale(1.1)'"
        onmouseleave="this.style.transform='scale(1)'"
      >ABC</button>
      <button
        id="bg-toggle" class="bg-toggle-btn" onclick="toggleBackground()" title="Ocultar imagem de fundo"
        style="
          background:#0058bd; color:#fff; border:none; border-radius:9999px;
          width:38px; height:38px; display:flex; align-items:center; justify-content:center;
          cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.2); transition:transform 0.1s;
        "
        onmouseenter="this.style.transform='scale(1.1)'"
        onmouseleave="this.style.transform='scale(1)'"
      >
        <span class="material-symbols-outlined" style="font-size:20px;">image</span>
      </button>
    </div>
  </div>
</header>

<!-- ── Jogo ─────────────────────────────────────────────────────────────────── -->
<main class="flex flex-col md:flex-row items-center justify-center gap-10 px-4 py-6 max-w-5xl mx-auto min-h-[calc(100vh-80px)]">

  <!-- Área da atividade -->
  <div class="glass rounded-3xl p-6 flex flex-col items-center gap-6 w-full max-w-md shadow-xl">

    <!-- Card -->
    <div
      id="activity-card"
      style="
        background:#fff; border:4px solid #0058bd;
        border-radius:20px; box-shadow:0 10px 0 0 #0058bd;
        padding:16px; width:100%;
        display:flex; flex-direction:column; align-items:center;
        transition:border-color 0.3s, box-shadow 0.3s;
      "
    >
      <div style="position:relative; width:100%; aspect-ratio:1; margin-bottom:12px;">
        <img
          id="word-image" src="" alt="Imagem da palavra"
          style="
            width:100%; height:100%; object-fit:cover;
            border-radius:12px; border:3px solid #dee1ff; background:#ececff;
          "
        />
        <!-- Placeholder amigável quando a palavra não tem foto -->
        <div
          id="word-placeholder"
          style="
            position:absolute; inset:0; display:none;
            flex-direction:column; align-items:center; justify-content:center; gap:6px;
            border-radius:12px; border:3px solid #dee1ff;
            background:linear-gradient(135deg,#eef0ff 0%,#dbe0ff 100%);
            color:#0058bd; text-align:center;
          "
        >
          <span class="material-symbols-outlined" style="font-size:84px;opacity:0.85;">hearing</span>
          <span style="font-size:16px;font-weight:700;">Ouça a palavra</span>
        </div>
        <button
          onclick="replayWordAudio()"
          style="
            position:absolute; bottom:10px; right:10px;
            background:#0058bd; color:#fff; border:none;
            border-radius:9999px; width:40px; height:40px;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.25);
            transition:transform 0.1s;
          "
          onmouseenter="this.style.transform='scale(1.1)'"
          onmouseleave="this.style.transform='scale(1)'"
        >
          <span class="material-symbols-outlined" style="font-size:20px;">volume_up</span>
        </button>
      </div>
      <h2
        id="word-text"
        style="
          font-size:40px; font-weight:700; color:#001159;
          font-family:'Quicksand',sans-serif;
          letter-spacing:-0.01em;
        "
      >&nbsp;</h2>
      <!-- Chips de letras embaralhadas (modo embaralhado) -->
      <div id="scramble-chips"></div>
      <!-- Modo palavra: caixas (uma por letra) + campo nativo oculto -->
      <div id="spell-boxes" onclick="focusSpellInput()"></div>
      <input id="spell-input" type="text" inputmode="text" autocomplete="off"
        autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Digite a palavra"
        style="opacity:0; width:0; height:0; border:0; padding:0; margin:0;" />
    </div>

    <!-- Botões de letra (modo letra) ou botão "mostrar palavra" (modo palavra) -->
    <div id="options-container" style="display:flex; gap:20px; justify-content:center; flex-wrap:wrap;"></div>

  </div>
</main>

<!-- ── Personagem do jogo (fixo no canto direito) ────────────────────────── -->
<div style="position:fixed; right:0; bottom:0; z-index:40; pointer-events:none;">
  <div
    id="character-group"
    onclick="replayWordAudio()"
    style="cursor:pointer; transition:transform 0.1s; pointer-events:auto;"
    onmouseenter="this.style.transform='scale(1.03)'"
    onmouseleave="this.style.transform='scale(1)'"
  >
    <img id="character-img" src="" alt="Personagem" style="width:360px; height:auto; display:block;" />
  </div>
</div>

</div><!-- /#game-screen -->

<!-- ── Tela final ───────────────────────────────────────────────────────────── -->
<div id="end-screen" class="hidden">
  <div class="glass rounded-3xl p-10 flex flex-col items-center gap-6 text-center shadow-2xl"
       style="max-width:400px; border:4px solid #fcbc05; box-shadow:0 12px 0 0 #7a5900;">
    <div style="font-size:72px;">🎉</div>
    <h2 style="font-size:36px;font-weight:700;color:#001159;font-family:'Quicksand',sans-serif;">Parabéns!</h2>
    <p id="final-score-text" style="font-size:20px;font-weight:600;color:#001159;font-family:'Quicksand',sans-serif;"></p>
    <button
      onclick="startGame()"
      style="
        background:#fcbc05; border:4px solid #7a5900;
        border-radius:9999px; padding:16px 40px;
        font-size:22px; font-weight:700; color:#6b4e00;
        font-family:'Quicksand',sans-serif;
        box-shadow:0 8px 0 0 #7a5900; cursor:pointer;
        transition:transform 0.1s, box-shadow 0.1s;
      "
      onmouseenter="this.style.transform='scale(1.05)'"
      onmouseleave="this.style.transform='scale(1)'"
      onmousedown="this.style.boxShadow='0 0px 0 0 #7a5900';this.style.transform='translateY(8px)'"
      onmouseup="this.style.boxShadow='0 8px 0 0 #7a5900';this.style.transform='scale(1)'"
    >Jogar Novamente</button>
    <button
      onclick="showMenu()"
      style="
        background:#0058bd; border:4px solid #00337a;
        border-radius:9999px; padding:12px 32px;
        font-size:18px; font-weight:700; color:#fff;
        font-family:'Quicksand',sans-serif;
        box-shadow:0 6px 0 0 #00337a; cursor:pointer;
        transition:transform 0.1s, box-shadow 0.1s;
      "
      onmouseenter="this.style.transform='scale(1.05)'"
      onmouseleave="this.style.transform='scale(1)'"
      onmousedown="this.style.boxShadow='0 0px 0 0 #00337a';this.style.transform='translateY(6px)'"
      onmouseup="this.style.boxShadow='0 6px 0 0 #00337a';this.style.transform='scale(1)'"
    >Voltar ao menu</button>
  </div>
</div>

    vowel:       base[0].toUpperCase()

// Como ainda não há um inventário fixo dessas imagens, geramos os nomes prováveis:
// <base> e <base>2, em jpg/jpeg/png/webp. O loadRound tenta cada um e cai no
// placeholder só quando todos falham.
function wordImageCandidates(base) {
  const list = [];
  for (const suf of ['', '2'])
    for (const ext of ['jpg', 'jpeg', 'png', 'webp'])
      list.push(`img/${base}${suf}.${ext}`);
  return list;
}

function makeWord(base, display, letter) {
  return { baseName: base, displayWord: display, vowel: letter, imageCandidates: wordImageCandidates(base) };
}

const DISTRACTORS = ['B','C','D','G','J','L','M','N','P','R','S','T','Z'];

// Sorteia até `total` palavras equilibrando entre as letras do grupo: pega 1 de
// cada letra por rodada (round-robin), completando de outra quando uma acaba.
// Ex.: 2 letras → ~10+10; P/B/T/D → 5 cada; vogais → 4 cada. Retorna <= total.
function pickBalanced(words, total) {
  const byLetter = {};
  for (const w of words) (byLetter[w.vowel] = byLetter[w.vowel] || []).push(w);
  const buckets = Object.values(byLetter);
  for (const b of buckets)
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  const picked = [];
  for (let round = 0; picked.length < total; round++) {
    let advanced = false;
    for (const b of buckets) {
      if (picked.length >= total) break;
      if (round < b.length) { picked.push(b[round]); advanced = true; }
    }
    if (!advanced) break;
  }
  return picked;
}

// Monta a config de uma atividade de letra inicial a partir do(s) grupo(s) de
// palavras. `words` = { LETRA: [[base, grafia], ...] } (uma ou duas letras).
// buildDeck sorteia até ROUND_SIZE palavras (balanceadas por letra, a cada
// sessão, sem repetir letra em sequência); buildOptions mostra a(s) letra(s) do
// grupo + distratores, somando 3 botões.
function letterActivity({ title, character, charStyle, words, blocks }) {
  // `words` = { LETRA: [[base,grafia],...] } → uma atividade com tudo embaralhado.
  // `blocks` = [ {LETRA:[...]}, ... ] → blocos mostrados NA ORDEM (cada um
  //   embaralhado por dentro), p/ atividades como o Q (QUA/QUO depois QUE/QUI).
  const groups = blocks || [words];
  const letters = [...new Set(groups.flatMap(g => Object.keys(g)))];
  const blockWords = groups.map(g =>
    Object.keys(g).flatMap(L => g[L].map(([b, d]) => makeWord(b, d, L)))
  );
  return {
    title, character, charStyle, keys: letters,
    buildDeck() {
      // Distribui o teto de 20 entre os blocos (proporcional, preservando a
      // ordem); cada bloco é balanceado por letra e embaralhado.
      const avail = blockWords.reduce((n, b) => n + b.length, 0);
      return blockWords.flatMap(b => {
        const cap = avail <= ROUND_SIZE ? b.length : Math.round(ROUND_SIZE * b.length / avail);
        return shuffleNoConsecutive(pickBalanced(b, cap));
      });
    },
    buildOptions(correct) {
      const opts = new Set([correct]);
      for (const L of letters) if (opts.size < 3) opts.add(L);
      const pool = DISTRACTORS.filter(x => !letters.includes(x));
      while (opts.size < 3) opts.add(pool[Math.floor(Math.random() * pool.length)]);
      return [...opts].sort(() => Math.random() - 0.5);
    }
  };
}

function findGapCharIndices(displayWord, pattern) {
  const chars = [...displayWord.normalize('NFC')];
  const pat   = [...pattern.normalize('NFC').toLowerCase()];
  const indices = [];
  for (let i = 0; i <= chars.length - pat.length; i++) {
    if (pat.every((pc, j) => chars[i + j].toLowerCase() === pc)) {
      for (let j = 0; j < pat.length; j++) indices.push(i + j);
      i += pat.length - 1;
    }
  }
  return indices;
}

  };
}

const VOWELS_SET = new Set(['a','e','i','o','u','ã','õ']);

function findVowelIndices(displayWord) {
  return [...displayWord.normalize('NFC')].reduce((acc, ch, i) => {
    if (isLetterChar(ch) && VOWELS_SET.has(ch.toLowerCase())) acc.push(i);
    return acc;
  }, []);
}

function findConsonantIndices(displayWord) {
  return [...displayWord.normalize('NFC')].reduce((acc, ch, i) => {
    if (isLetterChar(ch) && !VOWELS_SET.has(ch.toLowerCase())) acc.push(i);
    return acc;
  }, []);
}

function shuffleNoConsecutive(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  for (let i = 1; i < a.length; i++) {
    if (a[i].vowel === a[i-1].vowel) {
      for (let j = i + 1; j < a.length; j++) {
        if (a[j].vowel !== a[i-1].vowel) { [a[i], a[j]] = [a[j], a[i]]; break; }
      }
    }
  }
  return a;
}

const synth = window.speechSynthesis;

synth.onvoiceschanged = () => { voices = synth.getVoices(); };
voices = synth.getVoices();

function initAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function speakText(text, onEnd, onStart) {
  synth.cancel();
  const utt    = new SpeechSynthesisUtterance(text);
  utt.lang     = 'pt-BR';
  utt.pitch    = 1.15;
  utt.rate     = 0.88;
  if (onEnd)   utt.onend   = onEnd;
  if (onStart) utt.onstart = onStart;
  const ptVoice = voices.find(v => v.lang.startsWith('pt'));
  if (ptVoice) utt.voice = ptVoice;
  synth.speak(utt);
}

function playWordAudio(word, onEnd) {
  const mp3    = new Audio(`audio/${word.baseName}.mp3`);
  mp3.onended  = onEnd || null;
  mp3.onerror  = () => speakText(word.displayWord, onEnd);
  mp3.play().catch(() => speakText(word.displayWord, onEnd));
}

// Enunciado por modo: toca audio/enunciado_<modo>.* (m4a/mp3/ogg) e, só se nenhum
// formato existir, fala o texto por TTS. Bloqueio de autoplay NÃO cai no TTS — é
// resolvido pelo gesto/timeout em playRoundIntro.
const ENUNCIADOS = {
  letras:      { srcs: ['audio/enunciado_letra.m4a',       'audio/enunciado_letra.mp3',       'audio/enunciado_letra.ogg'],       text: 'Selecione a letra inicial da palavra' },
  palavras:    { srcs: ['audio/enunciado_palavra.m4a',     'audio/enunciado_palavra.mp3',     'audio/enunciado_palavra.ogg'],     text: 'Escute e escreva a palavra' },
  lacuna:      { srcs: ['audio/enunciado_lacuna.m4a',      'audio/enunciado_lacuna.mp3',      'audio/enunciado_lacuna.ogg'],      text: 'Complete as lacunas da palavra' },
  complete:    { srcs: ['audio/enunciado_complete.m4a',    'audio/enunciado_complete.mp3',    'audio/enunciado_complete.ogg'],    text: 'Escute e escreva a palavra completa' },
  vogais:      { srcs: ['audio/enunciado_vogais.m4a',      'audio/enunciado_vogais.mp3',      'audio/enunciado_vogais.ogg'],      text: 'Complete as vogais da palavra' },
  consoantes:  { srcs: ['audio/enunciado_consoantes.m4a',  'audio/enunciado_consoantes.mp3',  'audio/enunciado_consoantes.ogg'],  text: 'Complete as consoantes da palavra' },
  embaralhado: { srcs: ['audio/enunciado_embaralhado.m4a', 'audio/enunciado_embaralhado.mp3', 'audio/enunciado_embaralhado.ogg'], text: 'Descubra a palavra embaralhada' },
};
function playEnunciado(onEnd, onStart) {
  const { srcs, text } = ENUNCIADOS[gameMode] || ENUNCIADOS.letras;
  let settled = false;   // onEnd/fallback disparado uma única vez
  const audio = new Audio();
  if (onStart) audio.onplaying = onStart;
  audio.onended = () => { if (!settled) { settled = true; if (onEnd) onEnd(); } };
  let i = 0;
  const tryNext = () => {
    if (settled) return;
    if (i >= srcs.length) {                      // nenhum formato existe → TTS
      settled = true; speakText(text, onEnd, onStart); return;
    }
    audio.src = srcs[i++];
    audio.play().catch(() => {});                // autoplay bloqueado → espera gesto/timeout
  };
  audio.onerror = tryNext;                       // arquivo ausente/inválido → próximo formato
  tryNext();
}

function playRoundIntro(word) {
  const skipWordAudio = gameMode === 'embaralhado';
  // Rodadas seguintes já rolam após um gesto → áudio destravado.
  if (enunciadoDone) {
    if (skipWordAudio) { setButtonsEnabled(true); return; }
    playWordAudio(word, () => setButtonsEnabled(true));
    return;
  }

  // 1ª rodada: autoplay pode estar bloqueado pelo navegador (sem gesto ainda).
  // Três caminhos convergem em proceed(), que roda a cadeia uma única vez:
  //   a) enunciado tocou de fato → onend                (com áudio)
  //   b) 1º gesto resgata o autoplay bloqueado          (com áudio)
  //   c) timeout de segurança (bloqueado e sem gesto)   (em silêncio)
  let proceeded = false;
  let started   = false;
  let timer     = null;
  const overlay = document.getElementById('speech-overlay');

  function cleanup() {
    clearTimeout(timer);
    document.removeEventListener('pointerdown', rescue, true);
    document.removeEventListener('keydown', rescue, true);
  }

  function proceed(withWord) {
    if (proceeded) return;
    proceeded = true;
    cleanup();
    enunciadoDone = true;
    overlay.style.display = 'none';
    if (withWord && !skipWordAudio) setTimeout(() => playWordAudio(word, () => setButtonsEnabled(true)), 280);
    else                            setButtonsEnabled(true);
  }

  function startEnunciado() {
    playEnunciado(
      () => proceed(true),          // onEnd  → toca a palavra, depois habilita
      () => { started = true; }     // onStart → áudio realmente começou
    );
  }

  function rescue() {
    if (proceeded || started) return;   // autoplay já tocando → ignora gesto
    clearTimeout(timer);
    startEnunciado();                   // gesto destrava o áudio
    timer = setTimeout(() => proceed(false), 4500);
  }

  document.addEventListener('pointerdown', rescue, true);
  document.addEventListener('keydown', rescue, true);

  startEnunciado();                          // tenta autoplay
  timer = setTimeout(() => proceed(false), 4500);  // rede de segurança
}

function setButtonsEnabled(enabled) {
  document.querySelectorAll('#options-container .btn-letter').forEach(btn => {
    btn.disabled = !enabled;
    btn.style.opacity = enabled ? '1' : '0.5';
    btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
  });
  if (gameMode === 'palavras' || gameMode === 'lacuna' || gameMode === 'complete' || gameMode === 'vogais' || gameMode === 'consoantes' || gameMode === 'embaralhado') {
    const input = document.getElementById('spell-input');
    if (input) { input.disabled = !enabled; if (enabled && !answerLocked) input.focus(); }
    const skip = document.getElementById('spell-skip');
    if (skip) skip.style.visibility = enabled ? 'visible' : 'hidden';
  }
}

function playSuccessSound() {
  initAudioCtx();
  [523, 659, 784].forEach((freq, i) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.value = freq;
    const t = audioCtx.currentTime + i * 0.14;
    gain.gain.setValueAtTime(0.28, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.start(t); osc.stop(t + 0.35);
  });
}

function playErrorSound() {
  initAudioCtx();
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sawtooth'; osc.frequency.value = 220;
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
  osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.48);
}

function isLetterChar(c) { return /\p{L}/u.test(c); }

function setupSpellRound() {
  const chars = [...currentWord.displayWord.normalize('NFC')];
  spellTarget = { chars, letterTargets: chars.filter(isLetterChar) };
  const input = document.getElementById('spell-input');
  input.value = '';
  input.disabled = true;                          // habilita após o enunciado
  input.maxLength = spellTarget.letterTargets.length + 2;
  renderSpellBoxes();
}

function adjustSpellBoxSize() {
  const boxes = document.getElementById('spell-boxes');
  const count = boxes.querySelectorAll('.spell-box').length;
  let w, h, fs;
  if      (count <= 7)  { w = 34; h = 46; fs = 28; }
  else if (count <= 9)  { w = 27; h = 37; fs = 22; }
  else if (count <= 11) { w = 22; h = 30; fs = 18; }
  else                  { w = 18; h = 26; fs = 15; }
  boxes.style.gap = (count <= 9 ? 6 : 4) + 'px';
  boxes.querySelectorAll('.spell-box').forEach(b => {
    b.style.width    = w  + 'px';
    b.style.height   = h  + 'px';
    b.style.fontSize = fs + 'px';
  });
}

// Redesenha as caixas a partir do que foi digitado. Retorna true se a palavra
// inteira está correta.
function renderSpellBoxes() {
  if (!spellTarget) return false;
  const input = document.getElementById('spell-input');
  const typed = [...input.value.normalize('NFC')].filter(isLetterChar);
  const boxes = document.getElementById('spell-boxes');
  boxes.innerHTML = '';
  let slot = 0, allOk = true;
  for (const ch of spellTarget.chars) {
    const box = document.createElement('div');
    box.className = 'spell-box';
    if (!isLetterChar(ch)) {                       // hífen/espaço: já vêm dados
      box.classList.add('given');
      box.textContent = ch === ' ' ? ' ' : ch;
    } else {
      const t = typed[slot], target = spellTarget.letterTargets[slot];
      if (t == null) { box.textContent = ''; allOk = false; }
      else if (t.toLowerCase() === target.toLowerCase()) { box.classList.add('ok'); box.textContent = t; }
      else { box.classList.add('bad'); box.textContent = t; allOk = false; }
      slot++;
    }
    boxes.appendChild(box);
  }
  adjustSpellBoxSize();
  return typed.length === spellTarget.letterTargets.length && allOk;
}

  if (answerLocked || !currentWord || !spellTarget) return;

function setupGapRound() {
  const w = currentWord;
  const chars = [...w.displayWord.normalize('NFC')];
  const input = document.getElementById('spell-input');
  input.value = '';
  input.disabled = true;
  if (gameMode === 'lacuna') {
    const gapIndices = findGapCharIndices(w.displayWord, w.gapPattern);
    spellTarget = { chars, gapIndices, isGap: true, mode: 'lacuna' };
    input.maxLength = gapIndices.length + 2;
  } else if (gameMode === 'vogais') {
    const gapIndices = findVowelIndices(w.displayWord);
    const letterTargets = chars.filter(isLetterChar);
    spellTarget = { chars, gapIndices, letterTargets, isGap: true, mode: 'complete' };
    input.maxLength = letterTargets.length + 2;
  } else if (gameMode === 'consoantes') {
    const gapIndices = findConsonantIndices(w.displayWord);
    const letterTargets = chars.filter(isLetterChar);
    spellTarget = { chars, gapIndices, letterTargets, isGap: true, mode: 'complete' };
    input.maxLength = letterTargets.length + 2;
  } else {
    // complete
    const gapIndices = findGapCharIndices(w.displayWord, w.gapPattern);
    const letterTargets = chars.filter(isLetterChar);
    spellTarget = { chars, gapIndices, letterTargets, isGap: true, mode: 'complete' };
    input.maxLength = letterTargets.length + 2;
  }
  renderGapBoxes();
}

function renderGapBoxes() {
  if (!spellTarget || !spellTarget.isGap) return false;
  const input = document.getElementById('spell-input');
  const typed = [...input.value.normalize('NFC')].filter(isLetterChar);
  const boxes = document.getElementById('spell-boxes');
  boxes.innerHTML = '';
  const { chars, gapIndices } = spellTarget;

  if (spellTarget.mode === 'lacuna') {
    let gapSlot = 0, allOk = true;
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      const box = document.createElement('div');
      box.className = 'spell-box';
      if (!isLetterChar(ch)) {
        box.classList.add('given'); box.textContent = ch === ' ' ? ' ' : ch;
      } else if (gapIndices.includes(i)) {
        const t = typed[gapSlot++], target = ch;
        if (t == null) { allOk = false; }
        else if (t.toLowerCase() === target.toLowerCase()) { box.classList.add('ok'); box.textContent = t; }
        else { box.classList.add('bad'); box.textContent = t; allOk = false; }
      } else {
        box.classList.add('given'); box.textContent = ch;
      }
      boxes.appendChild(box);
    }
    adjustSpellBoxSize();
    return typed.length === gapIndices.length && allOk;
  } else {
    let slot = 0, allOk = true;
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      const box = document.createElement('div');
      box.className = 'spell-box';
      if (!isLetterChar(ch)) {
        box.classList.add('given'); box.textContent = ch === ' ' ? ' ' : ch;
      } else {
        const t = typed[slot++], target = ch;
        const isGap = gapIndices.includes(i);
        if (t == null) {
          if (!isGap) { box.classList.add('given'); box.textContent = ch; }
          allOk = false;
        } else if (t.toLowerCase() === target.toLowerCase()) {
          box.classList.add('ok'); box.textContent = t;
        } else {
          box.classList.add('bad'); box.textContent = t; allOk = false;
        }
      }
      boxes.appendChild(box);
    }
    adjustSpellBoxSize();
    return typed.length === spellTarget.letterTargets.length && allOk;
  }
}

function handleGuess(letter, correct, btnEl) {
  if (answerLocked) return;
  initAudioCtx();

  if (letter === correct) {
    answerLocked = true;
    score++;
    btnEl.classList.add('correct', 'animate-pop');
    playSuccessSound();
    spawnConfetti();

    const card = document.getElementById('activity-card');
    card.style.borderColor = '#298600';
    card.style.boxShadow   = '0 10px 0 0 #298600';
    setTimeout(() => card.classList.add('animate-bounce-once'), 50);
    setTimeout(() => playWordAudio(currentWord), 600);
    setTimeout(advanceRound, 2200);

  } else {
    wrongCount++;
    btnEl.classList.add('wrong', 'animate-shake');
    playErrorSound();
    setTimeout(() => btnEl.classList.remove('animate-shake'), 450);

    if (wrongCount >= 2) {
      answerLocked = true;
      document.querySelectorAll('#options-container .btn-letter').forEach(b => {
        if (b.dataset.letter === correct)
          b.classList.add('correct', 'animate-glow-correct');
      });
      setTimeout(() => playWordAudio(currentWord), 500);
      setTimeout(advanceRound, 2700);
    }
  }
}

// ─── Trilha de fundo ──────────────────────────────────────────────────────────────
let trilhaAudio  = null;
let trilhaTimers = [];

function stopTrilha() {
  trilhaTimers.forEach(clearTimeout);
  trilhaTimers = [];
  if (trilhaAudio) { trilhaAudio.pause(); trilhaAudio = null; }
}

function playTrilha(src) {
  stopTrilha();
  const a = new Audio(src);
  a.volume = 0.4;
  a.play().catch(() => {});
  trilhaAudio = a;
  // Após 15s inicia fadeout de 1.5s (30 passos × 50ms)
  trilhaTimers.push(setTimeout(() => {
    const steps = 30;
    let i = 0;
    const tick = setInterval(() => {
      i++;
      if (!trilhaAudio || trilhaAudio !== a) { clearInterval(tick); return; }
      a.volume = Math.max(0, 0.4 * (1 - i / steps));
      if (i >= steps) { clearInterval(tick); a.pause(); if (trilhaAudio === a) trilhaAudio = null; }
    }, 50);
    trilhaTimers.push(tick);
  }, 15000));
}

  } else {
    el.style.left      = '';
    el.style.right     = '24px';
    el.style.bottom    = '24px';
    el.style.transform = '';
  }
  const count = parseInt(localStorage.getItem(tema.countKey) || '0');
  localStorage.setItem(tema.countKey, count + 1);
  if (count < 3) playMenuGreeting(tema);
}

function playMenuGreeting(tema) {
  const audio = new Audio(tema.audio);
  audio.onerror = () => speakText(tema.frase);
  audio.play().catch(() => speakText(tema.frase));
}

// ─── Caixa alta / baixa das letras (padrão: alta) ──────────────────────────────
let letterCase = 'upper';
function applyLetterCase() {
  const gs = document.getElementById('game-screen');
  gs.classList.toggle('case-upper', letterCase === 'upper');
  gs.classList.toggle('case-lower', letterCase === 'lower');
  const btn = document.getElementById('case-toggle');
  if (btn) btn.textContent = letterCase === 'upper' ? 'ABC' : 'abc';
}
function toggleLetterCase() {
  letterCase = letterCase === 'upper' ? 'lower' : 'upper';
  applyLetterCase();
}

// ─── Teclado ──────────────────────────────────────────────────────────────────
// Letras simples disparam direto; dígrafos (ex.: CH) são digitados em 2 teclas:
// C depois H. pendingDigraph guarda a 1ª tecla até a 2ª (ou expira em 1,2s).
let pendingDigraph = '';
let pendingDigraphTimer = null;
function clickOption(letter) {
  const btn = document.querySelector(`#options-container [data-letter="${letter}"]`);
  if (btn) btn.click();
}
document.addEventListener('keydown', e => {
  if (gameMode !== 'letras') return;   // modo palavra: a digitação vai pro campo nativo
  const key = e.key.toUpperCase();
  if (key.length !== 1 || key < 'A' || key > 'Z') return;
  const keys = currentActivity.keys;

  // completa um dígrafo pendente (ex.: C + H = CH)
  if (pendingDigraph) {
    const combo = pendingDigraph + key;
    clearTimeout(pendingDigraphTimer); pendingDigraph = '';
    if (keys.includes(combo)) { clickOption(combo); return; }
    // combo inválido → segue tratando a tecla atual normalmente
  }
  // inicia um dígrafo se alguma resposta de 2 letras começa por esta tecla
  // (e a própria tecla não é uma resposta simples)
  if (!keys.includes(key) && keys.some(k => k.length === 2 && k[0] === key)) {
    pendingDigraph = key;
    pendingDigraphTimer = setTimeout(() => { pendingDigraph = ''; }, 1200);
    return;
  }
  if (keys.includes(key)) clickOption(key);
});

// ─── Grade de debug ───────────────────────────────────────────────────────────
(function buildDebugGrid() {
  const cols = 'ABCDEFGHIJ'.split('');
  const rows = 8;
  const grid = document.createElement('div');
  grid.id = 'debug-grid';
  for (let r = 1; r <= rows; r++) {
    for (let c = 0; c < cols.length; c++) {
      const cell = document.createElement('div');
      cell.className = 'debug-cell';
      cell.textContent = cols[c] + r;
      grid.appendChild(cell);
    }
  }
  document.body.appendChild(grid);

  const btn = document.createElement('button');
  btn.id = 'debug-grid-btn';
  btn.textContent = '⊞ grade';
  btn.addEventListener('click', () => {
    const visible = grid.classList.toggle('visible');
    btn.textContent = visible ? '✕ grade' : '⊞ grade';
  });
  document.body.appendChild(btn);
})();

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.body.addEventListener('click', () => initAudioCtx(), { once: true });
  document.getElementById('spell-input').addEventListener('input', onSpellInput);
  applyLetterCase();   // default: caixa alta
  showMenu();          // inicia na tela de seleção (chama applyBackground + updateMenuCharacter)
});
</script>
