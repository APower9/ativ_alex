<script>
        // Game Logic & Interactivity
        const gameData = [
            {
                word: "abelha",
                initial: "A",
                options: ["A", "E", "O"],
                imageSrc: "https://images.unsplash.com/photo-1588693810237-6d6fac045b62?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                imageAlt: "A stylized, cheerful illustration of a cute, friendly bee hovering in front of a bright blue sky. The art style is flat vector, highly colorful, with bold outlines, typical of modern children's books or educational apps. The bee has a happy face, large eyes, and striped body. The overall mood is vibrant, sunny, and engaging."
            },
            {
                word: "elefante",
                initial: "E",
                options: ["I", "E", "U"],
                imageSrc: "https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                imageAlt: "A stylized 3D render of a cute baby elephant sitting on green grass. The aesthetic is playful, colorful, and soft, suitable for a kids educational game. Bright, cheerful lighting."
            },
            {
                word: "urso",
                initial: "U",
                options: ["A", "O", "U"],
                imageSrc: "https://images.unsplash.com/photo-1534361960057-19889db9621e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                imageAlt: "A playful, flat vector illustration of a cuddly brown bear waving its paw. Background is a soft, pastel forest scene. Highly saturated colors, rounded shapes, playful learning design style."
            }
        ];

        let currentLevel = 0;
        let isAnimating = false;

        function loadLevel(levelIndex) {
            if(levelIndex >= gameData.length) levelIndex = 0; // loop
            currentLevel = levelIndex;
            const data = gameData[levelIndex];

            // Update UI
            document.getElementById('word-text').textContent = data.word;
            const imgEl = document.getElementById('word-image');
            imgEl.src = data.imageSrc;
            imgEl.setAttribute('data-alt', data.imageAlt);

            // Generate Buttons
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Randomize options slightly
            const shuffledOptions = [...data.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(letter => {
                const btnHTML = `
                    <button onclick="handleGuess('${letter}', '${data.initial}', this)" 
                            class="w-32 h-32 rounded-full border-4 text-[64px] font-bold flex items-center justify-center btn-chunky hover:scale-105 active:scale-95 transition-transform
                                   bg-surface-container-lowest text-primary border-primary" style="--tw-shadow-color: #0058bd;">
                        ${letter}
                    </button>
                `;
                optionsContainer.insertAdjacentHTML('beforeend', btnHTML);
            });
            
            // Announce word
            setTimeout(playWordAudio, 500);
        }

        function handleGuess(guess, correct, btnElement) {
            if(isAnimating) return;

            if(guess === correct) {
                // Success
                isAnimating = true;
                btnElement.classList.remove('bg-surface-container-lowest', 'text-primary', 'border-primary');
                btnElement.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed', 'border-tertiary-container');
                btnElement.style.setProperty('--tw-shadow-color', '#298600');
                btnElement.classList.add('pop');
                
                document.getElementById('activity-card').classList.add('border-tertiary-fixed', 'shadow-[0_12px_0_0_#298600]');
                
                playSuccessAudio();
                createConfetti();

                setTimeout(() => {
                    document.getElementById('activity-card').classList.remove('border-tertiary-fixed', 'shadow-[0_12px_0_0_#298600]');
                    isAnimating = false;
                    loadLevel(currentLevel + 1);
                }, 2500);

            } else {
                // Error
                isAnimating = true;
                btnElement.classList.add('shake', 'bg-error-container', 'text-on-error-container', 'border-error');
                btnElement.style.setProperty('--tw-shadow-color', '#ba1a1a');
                
                playErrorAudio();

                setTimeout(() => {
                    btnElement.classList.remove('shake', 'bg-error-container', 'text-on-error-container', 'border-error');
                    btnElement.style.setProperty('--tw-shadow-color', '#0058bd');
                    isAnimating = false;
                }, 500);
            }
        }

        // --- Audio Fallbacks (Web Speech API) ---
        const synth = window.speechSynthesis;
        let voices = [];

        function populateVoiceList() {
            voices = synth.getVoices().sort(function (a, b) {
                const aname = a.name.toUpperCase(), bname = b.name.toUpperCase();
                if (aname < bname) return -1;
                else if (aname == bname) return 0;
                else return +1;
            });
        }
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        function speakText(text) {
            if (synth.speaking) {
                synth.cancel();
            }
            if (text !== '') {
                const utterThis = new SpeechSynthesisUtterance(text);
                utterThis.lang = 'pt-BR';
                utterThis.pitch = 1.2; // slightly higher pitch for kids
                utterThis.rate = 0.9;  // slightly slower
                
                // Try to find a Portuguese voice
                const ptVoice = voices.find(v => v.lang.startsWith('pt'));
                if(ptVoice) utterThis.voice = ptVoice;

                synth.speak(utterThis);
            }
        }

        function playPromptAudio() {
            speakText("Selecione a letra inicial da palavra.");
        }

        function playWordAudio() {
            const word = gameData[currentLevel].word;
            speakText(word);
        }

        function playSuccessAudio() {
            speakText("Muito bem! " + gameData[currentLevel].initial + " de " + gameData[currentLevel].word);
        }

        function playErrorAudio() {
            speakText("Ops, tente de novo!");
        }

        // --- Simple Confetti Effect ---
        function createConfetti() {
            // Simplified HTML-based confetti for reliability without external libs
            const container = document.body;
            const colors = ['#0058bd', '#fcbc05', '#84fe58', '#ba1a1a'];
            
            for(let i=0; i<30; i++) {
                const confetto = document.createElement('div');
                confetto.style.position = 'fixed';
                confetto.style.width = '10px';
                confetto.style.height = '10px';
                confetto.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetto.style.left = Math.random() * 100 + 'vw';
                confetto.style.top = '-10px';
                confetto.style.zIndex = '9999';
                confetto.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                container.appendChild(confetto);

                // Animate falling
                const duration = Math.random() * 1000 + 1000;
                const endY = window.innerHeight;
                
                confetto.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*100 - 50}px, ${endY}px, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });

                setTimeout(() => {
                    confetto.remove();
                }, duration);
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadLevel(0);
            
            // Interaction to enable audio
            document.body.addEventListener('click', function initAudio() {
                // silent speech to unlock audio context
                const utterThis = new SpeechSynthesisUtterance('');
                synth.speak(utterThis);
                document.body.removeEventListener('click', initAudio);
            }, { once: true });
        });

    </script>
